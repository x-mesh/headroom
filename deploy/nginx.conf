# 정적 파일만 내준다. 이 앱은 백엔드가 없고 빌드 단계도 없어서 public/ 이 곧 산출물이다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 파일 이름에 내용 해시가 없다. 오래 캐시하면 고친 파일이 반영되지 않으므로 매번 확인하게 한다.
  # 그래도 바뀌지 않았으면 304 로 끝나 본문은 다시 내려가지 않는다.
  add_header Cache-Control "no-cache" always;

  # 이 앱이 실제로 쓰는 것만 허용한다. 노드 카드가 --util 같은 값을 style 속성으로 넣으므로
  # 인라인 스타일은 열어야 하고, 제조사 로고가 data URI 라 img-src 에 data: 가 필요하다.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types text/css text/javascript application/javascript image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
  }
}
